name: release-gate

# 仓库层门禁：本地脚本可以被绕过（直接 cp + commit），CI 是第二道防线。
# 注意：branch protection / required status check 属于仓库设置，
# 必须由管理员在 GitHub 网页手动开启，代码无法自我强制。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-gate:
    name: 静态门禁（语法/扫描/动态对账/AST/manifest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt

      - name: Python 语法编译检查
        run: python -m compileall -q gateway ops tests sync_from_chemask.py

      - name: 静态门禁（版本/测试数/工具清单对账 + 旧内容扫描 + AST import）
        run: python sync_from_chemask.py --check-only

      - name: 发布验证（manifest vs git blob）
        run: python sync_from_chemask.py --verify

  integration:
    name: 集成测试（真实 MySQL 8 service container）
    runs-on: ubuntu-latest
    needs: static-gate
    services:
      mysql:
        image: mysql:8.0
        env:
          # 仅 CI 隔离库的临时口令，与生产无关；不写入仓库任何文件
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: chemask_ci
          MYSQL_USER: chem_ci
          MYSQL_PASSWORD: ci-user-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: chem_ci
      MYSQL_PASSWORD: ci-user-only
      MYSQL_DB: chemask_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt

      - name: 建表（幂等迁移）
        run: |
          python -c "from gateway.db import init_db; init_db()"
          python ops/mcp_migrate.py

      - name: 全量测试（78 例，含并发与发布门禁回归）
        run: python -m pytest tests/ -q --no-header

  # 本 job 仅提示需要人工完成的仓库设置，不假装已强制。
  branch-protection-reminder:
    name: 提醒（需管理员手工开启 required check）
    runs-on: ubuntu-latest
    needs: [static-gate, integration]
    steps:
      - name: 输出人工步骤
        run: |
          echo "以下设置无法由仓库代码强制，需管理员在 GitHub 中手动完成："
          echo "  Settings → Branches → Add branch protection rule (main)"
          echo "  ✅ Require status checks to pass before merging"
          echo "  ✅ 选择 '静态门禁（语法/扫描/动态对账/AST/manifest）' 与 '集成测试（真实 MySQL 8 service container）'"
          echo "  ✅ Do not allow bypassing the above settings"
